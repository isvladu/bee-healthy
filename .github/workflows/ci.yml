name: CI

# Quality gate. Runs on pull requests into staging/main, and on pushes to main.
# (Pushes to staging are validated by the "verify" job in promote.yml, so we don't
# duplicate that run here.)
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
