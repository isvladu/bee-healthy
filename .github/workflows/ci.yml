name: CI

# Quality gate for the feature → main flow.
# Runs on pull requests into main (before merge) and on pushes to main (after
# merge). Merging main triggers Vercel's production deploy automatically.
#
# Recommended: protect `main` (Settings → Branches/Rules) to require this check
# and a PR before merging — that makes the green CI the gate to production.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
